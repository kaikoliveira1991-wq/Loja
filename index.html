<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="manifest" href="manifest.webmanifest">
  <title>KM Moda Urbana</title>

  <style>
    :root{
      --bg:#09090b;
      --card:#151518;
      --card2:#1d1d21;
      --text:#f6f6f6;
      --muted:#a4a4ad;
      --line:#29292f;
      --accent:#fff;
      --ok:#22c55e;
      --danger:#ef4444
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif
    }

    button,input,select,textarea{font:inherit}
    button{cursor:pointer;border:0}

    .app{
      max-width:1100px;
      margin:auto;
      padding-bottom:80px
    }

    .top{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(9,9,11,.94);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      padding:14px 18px
    }

    .toprow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px
    }

    .brand{
      font-weight:900;
      font-size:22px;
      letter-spacing:.08em
    }

    .brand small{
      display:block;
      font-size:9px;
      letter-spacing:.25em;
      color:var(--muted);
      font-weight:600
    }

    .iconbtn{
      background:var(--card);
      color:var(--text);
      border:1px solid var(--line);
      width:42px;
      height:42px;
      border-radius:12px
    }

    .badge{
      display:inline-flex;
      min-width:18px;
      height:18px;
      padding:0 5px;
      border-radius:9px;
      background:#ef4444;
      color:white;
      font-size:11px;
      align-items:center;
      justify-content:center;
      margin-left:-9px;
      vertical-align:top
    }

    main{padding:18px}

    .hero{
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      min-height:230px;
      background:linear-gradient(135deg,#1b1b1f,#0c0c0e);
      display:flex;
      flex-direction:column;
      justify-content:end;
      margin-bottom:18px
    }

    .hero h1{
      font-size:34px;
      max-width:540px;
      margin:0 0 8px
    }

    .hero p{
      color:var(--muted);
      margin:0 0 18px
    }

    .btn{
      padding:12px 16px;
      border-radius:12px;
      background:var(--accent);
      color:#080808;
      font-weight:800
    }

    .btn.dark{
      background:var(--card2);
      color:var(--text);
      border:1px solid var(--line)
    }

    .btn.green{
      background:var(--ok);
      color:#031408
    }

    .search{
      display:flex;
      gap:8px;
      margin:16px 0
    }

    .search input,
    .field input,
    .field select,
    .field textarea{
      width:100%;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      color:var(--text);
      padding:12px;
      outline:none
    }

    .field textarea{
      min-height:90px;
      resize:vertical
    }

    .cats{
      display:flex;
      gap:8px;
      overflow:auto;
      padding-bottom:4px;
      margin-bottom:18px
    }

    .pill{
      white-space:nowrap;
      background:var(--card);
      border:1px solid var(--line);
      color:var(--muted);
      padding:9px 13px;
      border-radius:999px
    }

    .pill.active{
      background:#fff;
      color:#000
    }

    h2{
      font-size:20px;
      margin:20px 0 12px
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px
    }

    .product{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      position:relative
    }

    .photo{
      aspect-ratio:1/1;
      background:#242428;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#777;
      overflow:hidden
    }

    .photo img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .pbody{padding:12px}
    .pname{font-weight:750}
    .price{font-weight:900;margin-top:5px}

    .stock{
      font-size:12px;
      color:var(--muted);
      margin-top:6px
    }

    .low{color:#f59e0b}
    .out{color:var(--danger)}

    .heart{
      position:absolute;
      right:9px;
      top:9px;
      width:34px;
      height:34px;
      border-radius:50%;
      background:rgba(0,0,0,.6);
      color:#fff
    }

    .bottom{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:rgba(10,10,12,.97);
      border-top:1px solid var(--line);
      display:flex;
      justify-content:center;
      z-index:20
    }

    .nav{
      max-width:700px;
      width:100%;
      display:grid;
      grid-template-columns:repeat(4,1fr)
    }

    .nav button{
      background:none;
      color:var(--muted);
      padding:11px 4px;
      font-size:12px
    }

    .nav button.active{color:#fff}

    .screen{display:none}
    .screen.active{display:block}

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.72);
      z-index:50;
      display:none;
      align-items:end;
      justify-content:center
    }

    .modal.open{display:flex}

    .sheet{
      background:#101013;
      border:1px solid var(--line);
      width:min(680px,100%);
      max-height:92vh;
      overflow:auto;
      border-radius:22px 22px 0 0;
      padding:18px
    }

    .sheethead{
      display:flex;
      justify-content:space-between;
      align-items:center
    }

    .formgrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px
    }

    .field{margin:10px 0}
    .field.full{grid-column:1/-1}

    .actions{
      display:flex;
      gap:8px;
      justify-content:flex-end;
      margin-top:14px
    }

    .adminitem,
    .cartitem{
      display:flex;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid var(--line);
      align-items:center
    }

    .thumb{
      width:68px;
      height:68px;
      border-radius:10px;
      background:#242428;
      object-fit:cover;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#777;
      overflow:hidden;
      flex-shrink:0
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .grow{flex:1}

    .qty{
      display:flex;
      align-items:center;
      gap:8px
    }

    .qty button{
      width:30px;
      height:30px;
      border-radius:8px;
      background:var(--card2);
      color:#fff
    }

    .empty{
      text-align:center;
      padding:50px 15px;
      color:var(--muted)
    }

    .total{
      display:flex;
      justify-content:space-between;
      font-size:18px;
      font-weight:900;
      padding:16px 0
    }

    .notice{
      background:#17171b;
      border:1px solid var(--line);
      padding:12px;
      border-radius:12px;
      color:var(--muted);
      font-size:13px;
      margin:12px 0
    }

    .upload-preview{
      width:100%;
      max-height:240px;
      object-fit:contain;
      border-radius:12px;
      margin-top:10px;
      display:none;
      background:#242428
    }

    @media(min-width:720px){
      .grid{
        grid-template-columns:repeat(4,1fr)
      }

      .hero{min-height:300px}

      .bottom{
        position:static;
        border:0;
        background:transparent;
        margin:0 18px 20px
      }

      .nav{
        border:1px solid var(--line);
        border-radius:14px
      }

      .app{padding-bottom:20px}

      .sheet{
        border-radius:20px;
        margin-bottom:4vh
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="top">
    <div class="toprow">

      <div class="brand">
        KM
        <small>MODA URBANA</small>
      </div>

      <button class="iconbtn" onclick="openCart()">
        🛒
        <span id="cartBadge" class="badge">0</span>
      </button>

    </div>
  </header>


  <main>

    <section id="home" class="screen active">

      <div class="hero">

        <h1>
          Estilo é mais do que roupa.
        </h1>

        <p>
          Escolha sua peça, confira o estoque e peça direto pelo WhatsApp.
        </p>

        <button
          class="btn"
          onclick="scrollToProducts()"
        >
          VER PRODUTOS
        </button>

      </div>


      <div class="search">

        <input
          id="search"
          placeholder="🔎 Buscar produtos..."
          oninput="renderProducts()"
        >

      </div>


      <div id="cats" class="cats"></div>


      <h2>Produtos</h2>

      <div id="products" class="grid"></div>

    </section>


    <section id="cart" class="screen">

      <h2>Seu carrinho</h2>

      <div id="cartList"></div>

      <div id="cartSummary"></div>

    </section>


    <section id="admin" class="screen">

      <h2>Gerenciar produtos</h2>

      <div class="notice">

        Os produtos são armazenados no Supabase.
        Assim, o catálogo pode ser acessado por diferentes celulares.

      </div>


      <button
        class="btn"
        onclick="openProductModal()"
      >
        + Novo produto
      </button>


      <div id="adminList"></div>


      <h2>Configuração</h2>


      <div class="field">

        <label>
          WhatsApp da loja (com DDI, somente números)
        </label>

        <input
          id="wa"
          placeholder="5596999999999"
          onchange="saveConfig()"
        >

      </div>


      <button
        class="btn dark"
        onclick="exportData()"
      >
        Exportar catálogo
      </button>


      <button
        class="btn dark"
        onclick="importData()"
      >
        Importar catálogo
      </button>


      <input
        id="importFile"
        type="file"
        accept=".json"
        style="display:none"
        onchange="doImport(event)"
      >

    </section>

  </main>


  <div class="bottom">

    <nav class="nav">

      <button
        class="active"
        onclick="show('home',this)"
      >
        ⌂<br>Início
      </button>


      <button
        onclick="show('home',this);scrollToProducts()"
      >
        ▦<br>Produtos
      </button>


      <button onclick="openCart()">
        🛒<br>Carrinho
      </button>


      <button
        onclick="show('admin',this);renderAdmin()"
      >
        ⚙<br>Admin
      </button>

    </nav>

  </div>

</div>


<!-- MODAL DE PRODUTO -->

<div
  id="productModal"
  class="modal"
  onclick="if(event.target===this)closeModal()"
>

  <div class="sheet">

    <div class="sheethead">

      <h2 id="modalTitle">
        Novo produto
      </h2>

      <button
        class="iconbtn"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>


    <div class="formgrid">


      <div class="field">

        <label>Nome</label>

        <input id="fName">

      </div>


      <div class="field">

        <label>Categoria</label>

        <select id="fCat">

          <option>Camisetas</option>
          <option>Bermudas</option>
          <option>Calças</option>
          <option>Moletom</option>
          <option>Acessórios</option>

        </select>

      </div>


      <div class="field">

        <label>Preço (R$)</label>

        <input
          id="fPrice"
          type="number"
          step="0.01"
        >

      </div>


      <div class="field">

        <label>Estoque</label>

        <input
          id="fStock"
          type="number"
          min="0"
        >

      </div>


      <!-- NOVO UPLOAD -->

      <div class="field full">

        <label>
          Foto do produto
        </label>

        <input
          id="fImageFile"
          type="file"
          accept="image/*"
          onchange="previewImage(event)"
        >

        <img
          id="uploadPreview"
          class="upload-preview"
          alt="Pré-visualização"
        >

        <div
          id="uploadStatus"
          class="notice"
          style="display:none"
        ></div>

      </div>


      <div class="field full">

        <label>
          Descrição
        </label>

        <textarea id="fDesc"></textarea>

      </div>


    </div>


    <div class="actions">

      <button
        class="btn dark"
        onclick="closeModal()"
      >
        Cancelar
      </button>


      <button
        id="saveProductBtn"
        class="btn"
        onclick="saveProduct()"
      >
        Salvar
      </button>

    </div>

  </div>

</div>


<!-- MODAL DE DETALHES -->

<div
  id="detailModal"
  class="modal"
  onclick="if(event.target===this)closeDetail()"
>

  <div class="sheet">

    <div id="detail"></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let products=[];

let cart=JSON.parse(
  localStorage.getItem('km_cart_v1')||'[]'
);

let activeCat='Todos';

let editing=null;

const CFG='km_config_v1';


function saveCart(){

  localStorage.setItem(
    'km_cart_v1',
    JSON.stringify(cart)
  );

  updateBadge();

}


function money(v){

  return Number(v||0).toLocaleString(
    'pt-BR',
    {
      style:'currency',
      currency:'BRL'
    }
  );

}


function updateBadge(){

  let n=cart.reduce(
    (a,x)=>a+x.qty,
    0
  );

  document.getElementById(
    'cartBadge'
  ).textContent=n;

}


function show(id,btn){

  document
    .querySelectorAll('.screen')
    .forEach(x=>x.classList.remove('active'));

  document
    .getElementById(id)
    .classList.add('active');

  document
    .querySelectorAll('.nav button')
    .forEach(x=>x.classList.remove('active'));

  if(btn)
    btn.classList.add('active');

  if(id==='home')
    renderProducts();

  if(id==='cart')
    renderCart();

}


function scrollToProducts(){

  setTimeout(()=>{

    document
      .getElementById('products')
      .scrollIntoView({
        behavior:'smooth'
      });

  },50);

}


function renderCats(){

  let cats=[
    'Todos',
    ...new Set(
      products
        .map(p=>p.category)
        .filter(Boolean)
    )
  ];

  document.getElementById('cats').innerHTML=

    cats.map(c=>`

      <button
        class="pill ${c===activeCat?'active':''}"
        onclick="activeCat='${esc(c)}';renderCats();renderProducts()"
      >
        ${esc(c)}
      </button>

    `).join('');

}


function renderProducts(){

  renderCats();

  let searchElement=
    document.getElementById('search');

  let q=
    (searchElement?.value||'')
    .toLowerCase();

  let arr=products.filter(p=>

    (activeCat==='Todos'||
      p.category===activeCat)

    &&

    String(p.name||'')
      .toLowerCase()
      .includes(q)

  );


  document.getElementById(
    'products'
  ).innerHTML=

    arr.length

    ?

    arr.map(p=>`

      <article class="product">

        <button
          class="heart"
          onclick="event.stopPropagation();toggleFav('${p.id}')"
        >
          ♡
        </button>


        <div
          class="photo"
          onclick="openDetail('${p.id}')"
        >

          ${
            p.image_url

            ?

            `<img
              src="${esc(p.image_url)}"
              alt="${esc(p.name)}"
            >`

            :

            'KM'
          }

        </div>


        <div
          class="pbody"
          onclick="openDetail('${p.id}')"
        >

          <div class="pname">
            ${esc(p.name)}
          </div>

          <div class="price">
            ${money(p.price)}
          </div>

          <div
            class="stock ${
              p.stock===0
              ?'out'
              :p.stock<=2
              ?'low'
              :''
            }"
          >

            ${
              p.stock===0
              ?'Sem estoque'
              :p.stock+' em estoque'
            }

          </div>

        </div>

      </article>

    `).join('')

    :

    '<div class="empty">Nenhum produto encontrado.</div>';

}


function esc(s){

  return String(s??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

}


/* ================================
   DETALHES
   ================================ */

function openDetail(id){

  let p=products.find(
    x=>String(x.id)===String(id)
  );

  if(!p)return;


  document.getElementById(
    'detail'
  ).innerHTML=`

    <div
      class="photo"
      style="border-radius:16px;margin-bottom:14px"
    >

      ${
        p.image_url

        ?

        `<img
          src="${esc(p.image_url)}"
          alt="${esc(p.name)}"
        >`

        :

        'KM'
      }

    </div>


    <h2>
      ${esc(p.name)}
    </h2>


    <div
      class="price"
      style="font-size:24px"
    >
      ${money(p.price)}
    </div>


    <p class="stock">
      ${p.stock} em estoque
    </p>


    ${
      p.size
      ?
      `<p>
        <b>Tamanho:</b>
        ${esc(p.size)}
      </p>`
      :
      ''
    }


    <p>
      ${esc(p.description||'')}
    </p>


    <div class="notice">
      Confira a disponibilidade antes de finalizar o pedido.
    </div>


    <button
      class="btn"
      ${p.stock?'':'disabled'}
      onclick="addToCart('${p.id}');closeDetail()"
    >
      Adicionar ao carrinho
    </button>

  `;


  document
    .getElementById('detailModal')
    .classList.add('open');

}


function closeDetail(){

  document
    .getElementById('detailModal')
    .classList.remove('open');

}


/* ================================
   CARRINHO
   ================================ */

function addToCart(id){

  let p=products.find(
    x=>String(x.id)===String(id)
  );

  if(!p||p.stock<=0)
    return alert('Produto sem estoque.');


  let item=cart.find(
    x=>String(x.id)===String(id)
  );


  if(item){

    if(item.qty>=p.stock)

      return alert(
        'Quantidade máxima disponível no estoque.'
      );

    item.qty++;

  }else{

    cart.push({
      id:String(id),
      qty:1
    });

  }


  saveCart();

  alert('Adicionado ao carrinho!');

}


function removeCart(id){

  cart=cart.filter(
    x=>String(x.id)!==String(id)
  );

  saveCart();

  renderCart();

}


function changeQty(id,d){

  let i=cart.find(
    x=>String(x.id)===String(id)
  );

  let p=products.find(
    x=>String(x.id)===String(id)
  );


  if(!i||!p)return;


  i.qty+=d;


  if(i.qty<=0){

    removeCart(id);

    return;

  }


  if(i.qty>p.stock)
    i.qty=p.stock;


  saveCart();

  renderCart();

}


function openCart(){

  show('cart');

  renderCart();

}


function renderCart(){

  let box=
    document.getElementById('cartList');


  if(!cart.length){

    box.innerHTML=`

      <div class="empty">

        Seu carrinho está vazio.

        <br><br>

        <button
          class="btn"
          onclick="show('home')"
        >
          Ver produtos
        </button>

      </div>

    `;


    document.getElementById(
      'cartSummary'
    ).innerHTML='';

    return;

  }


  let total=0;


  box.innerHTML=

    cart.map(i=>{

      let p=products.find(
        x=>String(x.id)===String(i.id)
      );


      if(!p)return '';


      total+=Number(p.price)*i.qty;


      return `

        <div class="cartitem">

          <div class="thumb">

            ${
              p.image_url

              ?

              `<img
                src="${esc(p.image_url)}"
                style="width:100%;height:100%;object-fit:cover;border-radius:10px"
              >`

              :

              'KM'
            }

          </div>


          <div class="grow">

            <b>
              ${esc(p.name)}
            </b>

            <div>
              ${money(p.price)}
            </div>


            <div class="qty">

              <button
                onclick="changeQty('${p.id}',-1)"
              >
                −
              </button>

              ${i.qty}

              <button
                onclick="changeQty('${p.id}',1)"
              >
                +
              </button>


              <button
                class="iconbtn"
                style="width:30px;height:30px"
                onclick="removeCart('${p.id}')"
              >
                🗑
              </button>

            </div>

          </div>

        </div>

      `;

    }).join('');


  document.getElementById(
    'cartSummary'
  ).innerHTML=`

    <div class="total">

      <span>Total</span>

      <span>
        ${money(total)}
      </span>

    </div>


    <button
      class="btn green"
      style="width:100%"
      onclick="checkoutWhatsApp()"
    >
      Finalizar pelo WhatsApp
    </button>

  `;

}


function checkoutWhatsApp(){

  let wa=
    (localStorage.getItem(CFG)||'')
    .replace(/\D/g,'');


  if(!wa){

    alert(
      'Configure o WhatsApp da loja no painel Admin.'
    );

    show('admin');

    return;

  }


  let lines=[

    'Olá! Quero fazer este pedido na KM Moda Urbana:',

    ''

  ];


  let total=0;


  cart.forEach(i=>{

    let p=products.find(
      x=>String(x.id)===String(i.id)
    );


    if(p){

      lines.push(
        `• ${p.name} — ${i.qty}x — ${money(Number(p.price)*i.qty)}`
      );

      total+=Number(p.price)*i.qty;

    }

  });


  lines.push(

    '',

    `Total: ${money(total)}`,

    '',

    'Pode me confirmar a disponibilidade e o pagamento?'

  );


  location.href=

    'https://wa.me/'+
    wa+
    '?text='+
    encodeURIComponent(
      lines.join('\n')
    );

}


/* ================================
   MODAL DO PRODUTO
   ================================ */

function openProductModal(id=null){

  editing=id;


  let p=id

    ?

    products.find(
      x=>String(x.id)===String(id)
    )

    :

    null;


  document.getElementById(
    'modalTitle'
  ).textContent=

    p
    ?
    'Editar produto'
    :
    'Novo produto';


  document.getElementById(
    'fName'
  ).value=p?.name||'';


  document.getElementById(
    'fCat'
  ).value=p?.category||'Camisetas';


  document.getElementById(
    'fPrice'
  ).value=p?.price??'';


  document.getElementById(
    'fStock'
  ).value=p?.stock??0;


  document.getElementById(
    'fDesc'
  ).value=p?.description||'';


  document.getElementById(
    'fImageFile'
  ).value='';


  document.getElementById(
    'uploadStatus'
  ).style.display='none';


  const preview =
    document.getElementById('uploadPreview');

  preview.src='';

  preview.style.display='none';


  document.getElementById(
    'productModal'
  ).classList.add('open');

}


function closeModal(){

  document
    .getElementById('productModal')
    .classList.remove('open');

}


/* ================================
   PRÉ-VISUALIZAÇÃO DA FOTO
   ================================ */

function previewImage(event){

  const file =
    event.target.files[0];

  const preview =
    document.getElementById('uploadPreview');


  if(!file){

    preview.src='';
    preview.style.display='none';

    return;

  }


  if(!file.type.startsWith('image/')){

    event.target.value='';

    preview.src='';
    preview.style.display='none';

    return alert(
      'Selecione uma imagem válida.'
    );

  }


  if(file.size > 10 * 1024 * 1024){

    event.target.value='';

    preview.src='';
    preview.style.display='none';

    return alert(
      'A imagem deve ter no máximo 10 MB.'
    );

  }


  preview.src=
    URL.createObjectURL(file);

  preview.style.display='block';

}


/* ================================
   SALVAR PRODUTO + UPLOAD
   ================================ */

async function saveProduct(){

  let name=
    document
      .getElementById('fName')
      .value
      .trim();


  if(!name)
    return alert('Informe o nome.');


  const fileInput =
    document.getElementById('fImageFile');


  const status =
    document.getElementById('uploadStatus');


  const saveButton =
    document.getElementById('saveProductBtn');


  let currentProduct =
    editing
      ?
      products.find(
        x=>String(x.id)===String(editing)
      )
      :
      null;


  let imageUrl =
    currentProduct?.image_url || null;


  /* ==========================
     BLOQUEIA BOTÃO
     ========================== */

  saveButton.disabled=true;

  saveButton.textContent=
    'Salvando...';


  try{


    /* ==========================
       UPLOAD DA FOTO
       ========================== */

    if(fileInput.files.length){

      const file=
        fileInput.files[0];


      if(!file.type.startsWith('image/')){

        throw new Error(
          'Selecione uma imagem válida.'
        );

      }


      if(file.size > 10 * 1024 * 1024){

        throw new Error(
          'A imagem deve ter no máximo 10 MB.'
        );

      }


      status.style.display='block';

      status.textContent=
        'Enviando foto para o Supabase...';


      const extension =
        file.name
          .split('.')
          .pop()
          .toLowerCase();


      const fileName =
        Date.now()+
        '-' +
        Math.random()
          .toString(36)
          .substring(2,10)+
        '.'+
        extension;


      const filePath =
        'produtos/' +
        fileName;


      const {
        error:uploadError
      } =
        await supabaseClient
          .storage
          .from('products')
          .upload(
            filePath,
            file,
            {
              cacheControl:'3600',
              upsert:false
            }
          );


      if(uploadError){

        console.error(
          'Erro no upload:',
          uploadError
        );

        throw new Error(
          'Erro ao enviar a foto: '+
          uploadError.message
        );

      }


      const {
        data:urlData
      } =
        supabaseClient
          .storage
          .from('products')
          .getPublicUrl(filePath);


      imageUrl=
        urlData.publicUrl;


      status.textContent=
        'Foto enviada! Salvando produto...';

    }


    /* ==========================
       DADOS DO PRODUTO
       ========================== */

    let productData={

      name:name,

      description:
        document
          .getElementById('fDesc')
          .value
          .trim()||null,

      price:
        Number(
          document
            .getElementById('fPrice')
            .value||0
        ),

      category:
        document
          .getElementById('fCat')
          .value||null,

      image_url:
        imageUrl,

      stock:
        Number(
          document
            .getElementById('fStock')
            .value||0
        ),

      active:true

    };


    /* ==========================
       SALVAR NO SUPABASE
       ========================== */

    let result;


    if(editing){

      result=
        await supabaseClient
          .from('products')
          .update(productData)
          .eq('id',editing);

    }else{

      result=
        await supabaseClient
          .from('products')
          .insert(productData);

    }


    if(result.error){

      console.error(
        'Erro ao salvar produto:',
        result.error
      );

      throw new Error(
        'Erro ao salvar produto: '+
        result.error.message
      );

    }


    /* ==========================
       FINALIZA
       ========================== */

    closeModal();


    await loadProductsFromSupabase();


    renderAdmin();


    alert(
      editing
        ?
        'Produto atualizado com sucesso!'
        :
        'Produto cadastrado com sucesso!'
    );


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      'Ocorreu um erro ao salvar o produto.'
    );


  }finally{

    saveButton.disabled=false;

    saveButton.textContent=
      'Salvar';

  }

}


/* ================================
   EXCLUIR PRODUTO
   ================================ */

async function deleteProduct(id){

  if(!confirm('Excluir este produto?'))
    return;


  let {error}=
    await supabaseClient
      .from('products')
      .delete()
      .eq('id',id);


  if(error){

    console.error(error);

    return alert(
      'Erro ao excluir: '+
      error.message
    );

  }


  cart=cart.filter(
    x=>String(x.id)!==String(id)
  );

  saveCart();


  await loadProductsFromSupabase();

  renderAdmin();

}

function toggleFav(id){

  let key='km_fav_v1';


  let a=
    JSON.parse(
      localStorage.getItem(key)||'[]'
    );


  a=a.includes(id)

    ?

    a.filter(x=>x!==id)

    :

    [...a,id];


  localStorage.setItem(
    key,
    JSON.stringify(a)
  );

}


/* ================================
   CARREGAR PRODUTOS
   ================================ */

async function loadProductsFromSupabase(){

  console.log(
    'Carregando produtos do Supabase...'
  );


  let {data,error}=

    await supabaseClient

      .from('products')

      .select('*')

      .eq('active',true)

      .order(
        'created_at',
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      'Erro ao carregar produtos:',
      error
    );


    alert(
      'Erro ao carregar produtos do Supabase: '+
      error.message
    );

    return;

  }


  console.log(
    'Produtos encontrados:',
    data
  );


  products=(data||[]).map(p=>({

    id:p.id,

    name:
      p.name||
      'Produto sem nome',

    description:
      p.description||
      '',

    price:
      Number(p.price||0),

    category:
      p.category||
      'Outros',

    image_url:
      p.image_url||
      '',

    stock:
      Number(p.stock||0),

    active:
      p.active

  }));


  renderProducts();

  updateBadge();

}
