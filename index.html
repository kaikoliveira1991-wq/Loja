<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KM Moda Urbana</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

header button{
  background:#fff;
  color:#111;
  border:0;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 0 20px;
}

.categories button{
  border:1px solid #ddd;
  background:#fff;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.categories button.active{
  background:#111;
  color:#fff;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

.product{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:14px;
}

.product h3{
  font-size:17px;
  margin-bottom:8px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.stock{
  font-size:13px;
  color:#555;
  margin-bottom:10px;
}

.product button{
  width:100%;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
  cursor:pointer;
}

.product button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

/* CARRINHO */

.cart{
  position:fixed;
  right:-400px;
  top:0;
  width:360px;
  max-width:95%;
  height:100vh;
  background:#fff;
  z-index:300;
  box-shadow:-5px 0 15px rgba(0,0,0,.2);
  transition:.3s;
  padding:20px;
  overflow-y:auto;
}

.cart.open{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.cart-header button{
  border:0;
  background:#eee;
  padding:8px 12px;
  border-radius:8px;
}

.cart-item{
  display:flex;
  gap:10px;
  margin-bottom:15px;
  border-bottom:1px solid #ddd;
  padding-bottom:15px;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
}

.cart-item-info{
  flex:1;
}

.cart-item-info h4{
  margin-bottom:5px;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.qty button{
  width:28px;
  height:28px;
  border:0;
  background:#111;
  color:#fff;
  border-radius:5px;
}

.cart-total{
  font-size:20px;
  font-weight:bold;
  margin:20px 0;
}

.whatsapp{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#25D366;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* ADMIN */

.admin{
  display:none;
  margin-top:30px;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.admin.show{
  display:block;
}

.admin-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

.admin-top button{
  background:#111;
  color:#fff;
  border:0;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
}

.form{
  display:none;
  margin-bottom:25px;
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
}

.form.show{
  display:block;
}

.form input,
.form textarea,
.form select{
  width:100%;
  padding:11px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:7px;
}

.form textarea{
  min-height:80px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:10px;
}

.form-actions button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:7px;
  cursor:pointer;
}

.save{
  background:#111;
  color:#fff;
}

.cancel{
  background:#ddd;
}

.admin-product{
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.admin-product img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
}

.admin-product-info{
  flex:1;
}

.admin-actions{
  display:flex;
  gap:6px;
}

.admin-actions button{
  border:0;
  padding:7px 9px;
  border-radius:6px;
  cursor:pointer;
}

.edit{
  background:#eee;
}

.delete{
  background:#e53935;
  color:#fff;
}

.notice{
  background:#fff3cd;
  border:1px solid #ffe69c;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:14px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:400;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-content{
  background:#fff;
  max-width:450px;
  width:100%;
  border-radius:12px;
  padding:20px;
  max-height:90vh;
  overflow-y:auto;
}

.modal-content img{
  width:100%;
  max-height:350px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:15px;
}

.modal-content button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
}

@media(max-width:600px){

  header{
    padding:15px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product img{
    height:190px;
  }

  .product-info{
    padding:10px;
  }

  .product h3{
    font-size:15px;
  }

  .price{
    font-size:16px;
  }

  .cart{
    width:100%;
    right:-100%;
  }

  .admin-product{
    align-items:flex-start;
  }

  .admin-actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    KM Moda Urbana
  </div>

  <button onclick="toggleCart()">
    🛒 Carrinho
  </button>

</header>


<div class="container">

  <div class="categories">

    <button class="active" onclick="filterCategory('Todos',this)">
      Todos
    </button>

    <button onclick="filterCategory('Camisas',this)">
      Camisas
    </button>

    <button onclick="filterCategory('Bermudas',this)">
      Bermudas
    </button>

    <button onclick="filterCategory('Calças',this)">
      Calças
    </button>

    <button onclick="filterCategory('Casacos',this)">
      Casacos
    </button>

  </div>


  <div id="products" class="products">
    Carregando produtos...
  </div>


  <!-- ADMIN -->

  <div id="admin" class="admin">

    <div class="admin-top">

      <h2>Administração</h2>

      <button onclick="newProduct()">
        + Novo produto
      </button>

    </div>


    <div class="notice">
      Os produtos são armazenados no Supabase.
    </div>


    <div id="productForm" class="form">

      <h3 id="formTitle">
        Novo produto
      </h3>

      <br>


      <input
        id="fName"
        type="text"
        placeholder="Nome do produto"
      >


      <textarea
        id="fDesc"
        placeholder="Descrição"
      ></textarea>


      <input
        id="fPrice"
        type="number"
        step="0.01"
        placeholder="Preço"
      >


      <select id="fCat">

        <option value="">
          Categoria
        </option>

        <option value="Camisas">
          Camisas
        </option>

        <option value="Bermudas">
          Bermudas
        </option>

        <option value="Calças">
          Calças
        </option>

        <option value="Casacos">
          Casacos
        </option>

        <option value="Outros">
          Outros
        </option>

      </select>


      <input
        id="fImage"
        type="text"
        placeholder="URL da imagem"
      >


      <input
        id="fStock"
        type="number"
        min="0"
        placeholder="Estoque"
      >


      <div class="form-actions">

        <button
          class="save"
          onclick="saveProduct()"
        >
          Salvar
        </button>

        <button
          class="cancel"
          onclick="closeForm()"
        >
          Cancelar
        </button>

      </div>

    </div>


    <div id="adminProducts"></div>

  </div>

</div>


<!-- CARRINHO -->

<div id="cart" class="cart">

  <div class="cart-header">

    <h2>
      Carrinho
    </h2>

    <button onclick="toggleCart()">
      ✕
    </button>

  </div>


  <div id="cartItems"></div>


  <div class="cart-total">
    Total: R$ <span id="cartTotal">0,00</span>
  </div>


  <button
    class="whatsapp"
    onclick="checkoutWhatsApp()"
  >
    Finalizar pelo WhatsApp
  </button>

</div>


<!-- MODAL PRODUTO -->

<div id="modal" class="modal">

  <div class="modal-content">

    <img id="modalImage" src="" alt="Produto">

    <h2 id="modalName"></h2>

    <br>

    <p id="modalDescription"></p>

    <br>

    <strong id="modalPrice"></strong>

    <button onclick="closeModal()">
      Fechar
    </button>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let products = [];

let cart = JSON.parse(
  localStorage.getItem('km_cart') || '[]'
);

let activeCat = 'Todos';

let editing = null;


/* =========================
   FORMATAR PREÇO
========================= */

function money(value){

  return Number(value || 0).toLocaleString(
    'pt-BR',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* =========================
   ESCAPAR HTML
========================= */

function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================
   CARREGAR PRODUTOS
========================= */

async function loadProductsFromSupabase(){

  const {
    data,
    error
  } = await supabaseClient

    .from('products')

    .select('*')

    .eq('active',true)

    .order(
      'created_at',
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    document.getElementById('products').innerHTML =
      '<p>Erro ao carregar produtos.</p>';

    return;

  }


  products = (data || []).map(p => ({

    id: p.id,

    name:
      p.name ||
      'Produto sem nome',

    description:
      p.description ||
      '',

    price:
      Number(p.price || 0),

    category:
      p.category ||
      'Outros',

    image_url:
      p.image_url ||
      '',

    stock:
      Number(p.stock || 0),

    active:
      p.active

  }));


  renderProducts();

  renderAdmin();

}


/* =========================
   MOSTRAR PRODUTOS
========================= */

function renderProducts(){

  const container =
    document.getElementById('products');


  let list = products;


  if(activeCat !== 'Todos'){

    list = products.filter(
      p => p.category === activeCat
    );

  }


  if(!list.length){

    container.innerHTML =
      '<p>Nenhum produto encontrado.</p>';

    return;

  }


  container.innerHTML =
    list.map(p => `

      <div class="product">

        <img
          src="${esc(
            p.image_url ||
            'https://via.placeholder.com/500x600?text=KM+Moda+Urbana'
          )}"
          alt="${esc(p.name)}"
        >

        <div class="product-info">

          <h3>
            ${esc(p.name)}
          </h3>

          <div class="price">
            R$ ${money(p.price)}
          </div>

          <div class="stock">
            ${
              p.stock > 0
              ? `Estoque: ${p.stock}`
              : 'Produto esgotado'
            }
          </div>

          <button
            onclick="openDetail('${p.id}')"
          >
            Ver produto
          </button>

        </div>

      </div>

    `).join('');

}


/* =========================
   FILTRAR CATEGORIA
========================= */

function filterCategory(
  category,
  button
){

  activeCat = category;


  document
    .querySelectorAll('.categories button')
    .forEach(
      b => b.classList.remove('active')
    );


  button.classList.add('active');


  renderProducts();

}


/* =========================
   DETALHES
========================= */

function openDetail(id){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(!p) return;


  document.getElementById('modalImage').src =
    p.image_url ||
    'https://via.placeholder.com/500x600?text=KM+Moda+Urbana';


  document.getElementById('modalName').textContent =
    p.name;


  document.getElementById('modalDescription').textContent =
    p.description;


  document.getElementById('modalPrice').textContent =
    `R$ ${money(p.price)}`;


  document.getElementById('modal').classList.add('show');

}


function closeModal(){

  document
    .getElementById('modal')
    .classList.remove('show');

}


/* =========================
   CARRINHO
========================= */

function toggleCart(){

  document
    .getElementById('cart')
    .classList.toggle('open');

  renderCart();

}


function addToCart(id){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(!p || p.stock <= 0)
    return;


  const existing =
    cart.find(
      x => String(x.id) === String(id)
    );


  if(existing){

    if(existing.qty < p.stock){

      existing.qty++;

    }

  }else{

    cart.push({

      id:p.id,

      name:p.name,

      price:p.price,

      image_url:p.image_url,

      qty:1

    });

  }


  saveCart();

  renderCart();

}


function changeQty(
  id,
  amount
){

  const item =
    cart.find(
      x => String(x.id) === String(id)
    );


  if(!item) return;


  const product =
    products.find(
      x => String(x.id) === String(id)
    );


  item.qty += amount;


  if(product && item.qty > product.stock){

    item.qty = product.stock;

  }


  if(item.qty <= 0){

    cart =
      cart.filter(
        x => String(x.id) !== String(id)
      );

  }


  saveCart();

  renderCart();

}


function saveCart(){

  localStorage.setItem(
    'km_cart',
    JSON.stringify(cart)
  );

}


function renderCart(){

  const container =
    document.getElementById('cartItems');


  if(!cart.length){

    container.innerHTML =
      '<p>Seu carrinho está vazio.</p>';

    document.getElementById('cartTotal')
      .textContent = '0,00';

    return;

  }


  let total = 0;


  container.innerHTML =
    cart.map(item => {

      const subtotal =
        Number(item.price) *
        Number(item.qty);


      total += subtotal;


      return `

        <div class="cart-item">

          <img
            src="${esc(
              item.image_url ||
              'https://via.placeholder.com/100'
            )}"
            alt="${esc(item.name)}"
          >

          <div class="cart-item-info">

            <h4>
              ${esc(item.name)}
            </h4>

            <div>
              R$ ${money(item.price)}
            </div>

            <div class="qty">

              <button
                onclick="changeQty('${item.id}',-1)"
              >
                -
              </button>

              <span>
                ${item.qty}
              </span>

              <button
                onclick="changeQty('${item.id}',1)"
              >
                +
              </button>

            </div>

          </div>

        </div>

      `;

    }).join('');


  document.getElementById('cartTotal')
    .textContent = money(total);

}


/* =========================
   WHATSAPP
========================= */

function checkoutWhatsApp(){

  if(!cart.length){

    alert('Seu carrinho está vazio.');

    return;

  }


  let message =
    'Olá! Gostaria de fazer um pedido:%0A%0A';


  let total = 0;


  cart.forEach(item => {

    const subtotal =
      Number(item.price) *
      Number(item.qty);


    total += subtotal;


    message +=
      `• ${encodeURIComponent(item.name)} - ${item.qty}x - R$ ${money(subtotal)}%0A`;

  });


  message +=
    `%0A*Total: R$ ${money(total)}*`;


  /*
    TROQUE O NÚMERO ABAIXO PELO
    WHATSAPP DA SUA LOJA.

    Exemplo:
    5596999999999
  */

  const phone =
    '5596999999999';


  window.open(
    `https://wa.me/${phone}?text=${message}`,
    '_blank'
  );

}


/* =========================
   ADMIN
========================= */

function showAdmin(){

  document
    .getElementById('admin')
    .classList.add('show');

  renderAdmin();

}


function newProduct(){

  editing = null;


  document.getElementById('formTitle')
    .textContent = 'Novo produto';


  document.getElementById('fName').value = '';

  document.getElementById('fDesc').value = '';

  document.getElementById('fPrice').value = '';

  document.getElementById('fCat').value = '';

  document.getElementById('fImage').value = '';

  document.getElementById('fStock').value = '';


  document
    .getElementById('productForm')
    .classList.add('show');

}


function closeForm(){

  document
    .getElementById('productForm')
    .classList.remove('show');

}


/* =========================
   SALVAR PRODUTO
========================= */

async function saveProduct(){

  const name =
    document.getElementById('fName')
      .value.trim();


  if(!name){

    alert('Digite o nome do produto.');

    return;

  }


  const productData = {

    name:name,

    description:
      document.getElementById('fDesc')
        .value.trim() || null,

    price:
      Number(
        document.getElementById('fPrice')
          .value || 0
      ),

    category:
      document.getElementById('fCat')
        .value || null,

    image_url:
      document.getElementById('fImage')
        .value.trim() || null,

    stock:
      Number(
        document.getElementById('fStock')
          .value || 0
      ),

    active:true

  };


  let result;


  if(editing){

    result =
      await supabaseClient

        .from('products')

        .update(productData)

        .eq('id',editing);

  }else{

    result =
      await supabaseClient

        .from('products')

        .insert(productData);

  }


  if(result.error){

    console.error(result.error);

    alert(
      'Erro ao salvar produto: ' +
      result.error.message
    );

    return;

  }


  alert(
    editing
      ? 'Produto atualizado!'
      : 'Produto cadastrado!'
  );


  editing = null;


  closeForm();


  await loadProductsFromSupabase();

}


/* =========================
   EDITAR PRODUTO
========================= */

function editProduct(id){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(!p) return;


  editing = p.id;


  document.getElementById('formTitle')
    .textContent = 'Editar produto';


  document.getElementById('fName').value =
    p.name || '';


  document.getElementById('fDesc').value =
    p.description || '';


  document.getElementById('fPrice').value =
    p.price || '';


  document.getElementById('fCat').value =
    p.category || '';


  document.getElementById('fImage').value =
    p.image_url || '';


  document.getElementById('fStock').value =
    p.stock || 0;


  document
    .getElementById('productForm')
    .classList.add('show');

}


/* =========================
   EXCLUIR PRODUTO
========================= */

async function deleteProduct(id){

  const confirmDelete =
    confirm(
      'Tem certeza que deseja excluir este produto?'
    );


  if(!confirmDelete)
    return;


  const {
    error
  } =
    await supabaseClient

      .from('products')

      .delete()

      .eq('id',id);


  if(error){

    console.error(error);

    alert(
      'Erro ao excluir produto: ' +
      error.message
    );

    return;

  }


  alert('Produto excluído.');


  await loadProductsFromSupabase();

}


/* =========================
   LISTA ADMIN
========================= */

function renderAdmin(){

  const container =
    document.getElementById('adminProducts');


  if(!container)
    return;


  if(!products.length){

    container.innerHTML =
      '<p>Nenhum produto cadastrado.</p>';

    return;

  }


  container.innerHTML =
    products.map(p => `

      <div class="admin-product">

        <img
          src="${esc(
            p.image_url ||
            'https://via.placeholder.com/100'
          )}"
          alt="${esc(p.name)}"
        >


        <div class="admin-product-info">

          <strong>
            ${esc(p.name)}
          </strong>

          <div>
            R$ ${money(p.price)}
          </div>

          <small>
            Estoque: ${p.stock}
          </small>

        </div>


        <div class="admin-actions">

          <button
            class="edit"
            onclick="editProduct('${p.id}')"
          >
            Editar
          </button>


          <button
            class="delete"
            onclick="deleteProduct('${p.id}')"
          >
            Excluir
          </button>

        </div>

      </div>

    `).join('');

}


/* =========================
   INICIAR
========================= */

document.addEventListener(
  'DOMContentLoaded',
  async () => {

    await loadProductsFromSupabase();

    renderCart();

  }
);

</script>

</body>
</html>
